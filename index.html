<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <title>环境监测仪表盘</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .value {
            font-size: 28px;
            font-weight: bold;
            margin: 8px 0;
        }
        .unit {
            color: #666;
            font-size: 14px;
        }
        .label {
            color: #333;
            font-size: 16px;
        }
        .temperature { color: #e74c3c; }
        .humidity { color: #3498db; }
        .light { color: #f39c12; }
        .soil-moisture { color: #2ecc71; }
        
        /* 横向模式 (宽度大于高度) */
        @media screen and (orientation: landscape) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* 平板及以上尺寸 */
        @media (min-width: 600px) {
            body {
                padding: 20px;
            }
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .card {
                padding: 20px;
                border-radius: 10px;
            }
            .value {
                font-size: 32px;
            }
            .unit {
                font-size: 16px;
            }
            .label {
                font-size: 18px;
            }
        }
        
        /* 大屏幕 */
        @media (min-width: 900px) {
            .value {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>
    <h1 style="text-align: center; font-size: 1.5rem;">环境监测仪表盘</h1>
    
    <div class="dashboard">
        <div class="card temperature">
            <div class="label">温度</div>
            <div class="value" id="temperature">--</div>
            <div class="unit">°C</div>
        </div>
        
        <div class="card humidity">
            <div class="label">湿度</div>
            <div class="value" id="humidity">--</div>
            <div class="unit">%</div>
        </div>
        
        <div class="card light">
            <div class="label">光照</div>
            <div class="value" id="light">--</div>
            <div class="unit">Lux</div>
        </div>
        
        <div class="card soil-moisture">
            <div class="label">土壤湿度</div>
            <div class="value" id="soilMoisture">--</div>
            <div class="unit">数值</div>
        </div>
    </div>

    <script>
        // WebSocket连接地址
        const url = 'ws://broker.emqx.io:8083/mqtt'
        const topic = 'Yoseya/esp32'

        const options = {
            clean: true,
            connectTimeout: 4000,
            clientId: 'emqx_test_' + Math.random().toString(16).substring(2, 8),
            username: 'emqx_test',
            password: 'emqx_test',
        }

        // 创建连接
        const client = mqtt.connect(url, options)

        // 连接成功回调
        client.on('connect', () => {
            console.log('Connected to MQTT broker')

            // 订阅主题
            client.subscribe(topic, { qos: 1 }, (err) => {
                if (err) {
                    console.error('Subscription error:', err)
                } else {
                    console.log(`Subscribed to ${topic}`)
                }
            })
        })

        // 消息接收处理
        client.on('message', (topic, message) => {
            console.log(`${topic}: ${message.toString()}`)
            try {
                const data = JSON.parse(message.toString())
                updateDashboard(data)
            } catch (e) {
                console.error('解析JSON失败:', e)
            }
        })

        // 更新仪表盘数据
        function updateDashboard(data) {
            if (data.temperature !== undefined) {
                document.getElementById('temperature').textContent = data.temperature.toFixed(1)
            }
            if (data.humidity !== undefined) {
                document.getElementById('humidity').textContent = data.humidity.toFixed(1)
            }
            if (data.light !== undefined) {
                document.getElementById('light').textContent = data.light.toFixed(1)
            }
            if (data.soil_moisture !== undefined) {
                document.getElementById('soilMoisture').textContent = data.soil_moisture
            }
        }

        // 错误处理
        client.on('error', (err) => {
            console.error('Connection error:', err)
            client.end()
        })

        client.on('close', () => {
            console.log('Connection closed')
        })
    </script>
</body>
</html>
